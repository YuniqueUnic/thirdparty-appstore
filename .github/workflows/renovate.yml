name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      manual-trigger:
        description: 'Manually trigger Renovate'
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          # Renovate 用 GITHUB_TOKEN 创建的分支/PR 不会触发 on: push / on: pull_request 工作流；
          # 配置 RENOVATE_TOKEN（PAT）后可恢复 renovate-app-version.yml 的自动联动。
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
